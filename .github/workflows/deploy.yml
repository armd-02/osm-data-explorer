name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Self-healing redirect for the previous bundle
        # (#47続報) デプロイでバンドル名が変わると旧ファイルはサーバーから消え(404)る。
        # ここでは公開中サイトの現行バンドル名をフェッチし、そのパスにセルフヒーリング
        # リダイレクト（一意query付きで最新版へ自動リロード）を dist/ に置くことで、
        # ブラウザキャッシュに旧HTMLが残っていてもキャッシュ期限切れ後に自動回復する。
        # 旧CSSもプレースホルダで404回避。サイトがフェッチできない場合は何もしない。
        run: |
          LIVE="https://armd-02.github.io/osm-data-explorer/"
          PREV_JS=$(curl -sf --max-time 15 "$LIVE" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 | sed 's|assets/||' || true)
          PREV_CSS=$(curl -sf --max-time 15 "$LIVE" | grep -o 'assets/index-[A-Za-z0-9_-]*\.css' | head -1 | sed 's|assets/||' || true)
          echo "live bundle: js=${PREV_JS:-none} css=${PREV_CSS:-none}"
          if [ -n "$PREV_JS" ] && [ ! -f "dist/assets/$PREV_JS" ]; then
            cp selfheal/redirect.js "dist/assets/$PREV_JS"
            echo "added self-healing redirect: $PREV_JS"
          fi
          if [ -n "$PREV_CSS" ] && [ ! -f "dist/assets/$PREV_CSS" ]; then
            cp selfheal/placeholder.css "dist/assets/$PREV_CSS"
            echo "added css placeholder: $PREV_CSS"
          fi

      - name: Copy Pages config files
        # 注: GitHub Pages は _headers をサポートしていないため実際には無効（実測済 #47続報）。
        # 旧バンドル固定対策は index.html のセルフアップデートスクリプトが担う。
        # ファイル自体は対応するホスティングへの移植用に保持。
        run: cp _headers dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

